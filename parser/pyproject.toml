[project]
name = "litrag-parser"
version = "0.2.0"
description = "litrag's parsing worker: Docling over PDFs and JATS into one node tree, spoken to over JSON lines."
requires-python = ">=3.11"
dependencies = [
    "docling>=2.40",
]

[project.scripts]
litrag-parser = "litrag_parser.worker:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litrag_parser"]
